services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veayos-clinicalos-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
      - JWT_SECRET=veayos-super-secret-jwt-key-for-homoeopathy-clinicalos-2025
      - WHITELIST_ACCOUNTS=vpdixit75@gmail.com,ved@veayos.com
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: veayos-clinicalos-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
